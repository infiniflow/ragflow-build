name: onnxruntime release

# Build scripts live in onnxruntime/ (one directory per vendored dependency).
# GitHub only loads workflows from .github/workflows, hence this file lives
# here while everything it executes lives under onnxruntime/.

on:
  push:
    tags:
      # The tag carries the version: pushing release-v1.30.0 builds and
      # publishes onnxruntime v1.30.0. The onnxruntime-v* form is accepted too,
      # and is the safer choice once this repo vendors more than one dependency.
      - 'release-v*'
      - 'onnxruntime-v*'
  workflow_dispatch:
    inputs:
      ort_version:
        description: 'onnxruntime tag to build (default: onnxruntime/ORT_VERSION)'
        required: false
        default: ''
      dry_run:
        description: 'Build only, do not publish a GitHub release'
        type: boolean
        default: false
      draft:
        description: 'Publish the release as a draft'
        type: boolean
        default: true

permissions:
  contents: read

env:
  # keep in sync with onnxruntime/ORT_VERSION when bumping manually
  ORT_PKG: onnxruntime

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      base_version: ${{ steps.version.outputs.base_version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Resolve onnxruntime version
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.ort_version }}
        run: |
          set -euo pipefail
          # 1. tag push: the tag name carries the version
          # 2. manual run: the ort_version input
          # 3. fallback: whatever is pinned in onnxruntime/ORT_VERSION
          version=""
          case "$REF_NAME" in
            release-v*)     version="${REF_NAME#release-}" ;;
            onnxruntime-v*) version="${REF_NAME#onnxruntime-}" ;;
          esac
          [ -n "$version" ] || version="$INPUT_VERSION"
          [ -n "$version" ] || version="$(tr -d '[:space:]' < "${{ env.ORT_PKG }}/ORT_VERSION")"

          pinned="$(tr -d '[:space:]' < "${{ env.ORT_PKG }}/ORT_VERSION")"
          if [ "$version" != "$pinned" ]; then
            echo "::warning::building $version but ${ORT_PKG}/ORT_VERSION pins $pinned"
            echo "::warning::run 'onnxruntime/scripts/bump.sh $version' and commit to keep them in sync"
          fi

          case "$version" in
            v*) : ;;
            *) echo "::error::version '$version' must start with 'v' (e.g. v1.29.0)"; exit 1 ;;
          esac

          # The upstream onnxruntime is fetched from microsoft/onnxruntime, where
          # only real releases exist (e.g. v1.29.0). A release tag may carry a
          # vendor suffix like -patch1; strip it to get the tag we actually fetch
          # and build (the patch is applied on top by init-submodules.sh).
          base_version="${version%-*}"
          [ "$base_version" != "$version" ] && \
            echo "::notice::release tag '$version' -> fetching upstream '$base_version' + vendored patches"

          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "base_version=$base_version" >> "$GITHUB_OUTPUT"
          echo "onnxruntime version: $version (trigger: ${{ github.event_name }}, ref: $REF_NAME)"

  build:
    name: build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            # ubuntu-22.04 pins glibc 2.35 / GCC 11.4: the oldest toolchain that
            # still satisfies ORT's GCC>=11.1 floor while NOT emitting the
            # non-portable __isoc23_* (glibc>=2.38) or _M_replace_cold (GCC>=12)
            # symbols. The published .a must link on the consumer's Ubuntu 22.04.
            os: ubuntu-22.04
          # Native arm64 runner. If your repo has no access to arm runners,
          # change os to ubuntu-latest: onnxruntime/build.sh then falls back to
          # aarch64 cross compilation (see scripts/cross-linux-aarch64.sh).
          - target: linux-aarch64
            os: ubuntu-24.04-arm
          - target: osx-arm64
            os: macos-latest
          - target: osx-universal
            os: macos-latest
          # Windows is disabled for now: the runner image has no Visual Studio
          # instance, so CMake configure dies with
          #   Generator "Visual Studio 17 2022" could not find any instance of
          #   Visual Studio.
          # onnxruntime/build.sh already supports both windows-x64 and
          # windows-arm64; uncomment these once a runner with the MSVC
          # toolchain (and vcvarsall / lib.exe for packaging) is available.
          # - target: windows-x64
          #   os: windows-latest
          # - target: windows-arm64
          #   os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      # Python 3.10 mirrors the portable build recipe (ubuntu-22.04's system
      # interpreter). ORT's build.py uses PEP 585 generics, so the runtime must
      # be >= 3.9; 3.10 satisfies that and needs no extra venv toolchain.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ORT's --include_ops_by_config path (reduce_op_kernels.py) imports
      # parse_config from the `util` package, which is only re-exported when
      # flatbuffers is importable (see onnxruntime/tools/python/util/__init__.py).
      # Without it the build dies at import time with
      #   ImportError: cannot import name 'parse_config' from 'util'
      # The local dev venv pulls flatbuffers in transitively; CI's bare
      # setup-python image does not, so install it explicitly.
      #
      # ubuntu-22.04 ships CMake 3.22, but ORT 1.29.0 requires >= 3.28. Pull a
      # current CMake from PyPI (same mechanism already used for flatbuffers).
      - name: Install build deps
        run: python -m pip install --upgrade pip "cmake>=3.28" flatbuffers

      - name: Setup Ninja (unix)
        if: runner.os != 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Setup MSVC (windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.target == 'windows-arm64' && 'amd64_arm64' || 'x64' }}

      - name: Fetch onnxruntime ${{ needs.prepare.outputs.base_version }}
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ needs.prepare.outputs.base_version }}" > "${{ env.ORT_PKG }}/ORT_VERSION"
          bash "${{ env.ORT_PKG }}/scripts/init-submodules.sh"

      - name: Build ${{ matrix.target }}
        shell: bash
        run: |
          # Equivalent to:
          #   --config Release
          #   --cmake_extra_defines onnxruntime_BUILD_SHARED_LIB=OFF
          #   --minimal_build --disable_ml_ops --disable_rtti --disable_exceptions
          #   --parallel --include_ops_by_config onnxruntime/required_operators.config
          #
          # --disable_contrib_ops is intentionally NOT used: the DeepDoc weights
          # need the com.microsoft fused kernels listed in that config.
          bash "${{ env.ORT_PKG }}/build.sh" --target "${{ matrix.target }}"

      - name: Smoke test (load the DeepDoc models)
        # A build that compiles fine can still be unable to load the models it
        # was reduced for, so link the packaged archive and create a session for
        # every weight before the artifact is uploaded or released.
        shell: bash
        env:
          HF_ENDPOINT: https://huggingface.co
          DEEPDOC_MODELS: det layout rec tsr
        run: |
          set -euo pipefail
          pkg="${{ env.ORT_PKG }}"
          zip_path="$(ls "$pkg"/dist/*.zip | head -1)"
          [ -n "$zip_path" ] || { echo "::error::no packaged zip found in $pkg/dist"; exit 1; }

          work="$(mktemp -d)"
          unzip -q "$zip_path" -d "$work"
          lib_dir="$(find "$work" -type d -name lib -print -quit)"
          [ -n "$lib_dir" ] || { echo "::error::no lib/ directory in $zip_path"; exit 1; }
          root="$(dirname "$lib_dir")"
          [ -f "$root/lib/libonnxruntime.a" ] || { echo "::error::libonnxruntime.a missing"; exit 1; }

          models="$work/models"
          mkdir -p "$models"
          for m in $DEEPDOC_MODELS; do
            # --retry alone does not cover transport errors such as
            # "SSL_ERROR_SYSCALL", and a flaky download must not fail a release.
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --max-time 600 \
              -o "$models/$m.ort" \
              "$HF_ENDPOINT/InfiniFlow/deepdoc/resolve/main/$m.ort" \
              || { echo "::error::failed to download $m.ort"; exit 1; }
          done

          cat > "$work/probe.c" <<'EOF'
          #include <stdio.h>
          #include "onnxruntime_c_api.h"
          int main(int argc, char **argv) {
              const OrtApi *api = OrtGetApiBase()->GetApi(ORT_API_VERSION);
              OrtEnv *env = NULL; OrtSessionOptions *so = NULL; OrtSession *s = NULL;
              if (api->CreateEnv(ORT_LOGGING_LEVEL_ERROR, "smoke", &env) != NULL) return 2;
              if (api->CreateSessionOptions(&so) != NULL) return 2;
              OrtStatus *st = api->CreateSession(env, argv[1], so, &s);
              if (st != NULL) {
                  fprintf(stderr, "FAIL %s: %s\n", argv[1], api->GetErrorMessage(st));
                  return 1;
              }
              printf("ok   %s\n", argv[1]);
              return 0;
          }
          EOF

          cxx="${CXX:-c++}"
          if [ "$(uname -s)" = "Darwin" ]; then
            # ORT's static lib references macOS system frameworks (absl/cctz pulls
            # CoreFoundation for local_time_zone(); apple_log_sink.mm pulls
            # Foundation for NSLog). They are left unresolved in the .a and must
            # be supplied by the final linker.
            libs="-lc++ -lpthread -lm -framework CoreFoundation -framework Foundation -framework Security"
          else
            libs="-lpthread -ldl -lm"
          fi
          "$cxx" -O0 -o "$work/probe" "$work/probe.c" -I"$root/include" \
              "$root/lib/libonnxruntime.a" $libs

          fail=0
          for m in $DEEPDOC_MODELS; do
            "$work/probe" "$models/$m.ort" || fail=1
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::the build cannot load every DeepDoc model"
            exit 1
          fi
          echo "all DeepDoc models loaded"

      - name: Verify shared-initializer APIs (linux-x86_64)
        # The shipped static lib must expose the custom shared-initializer APIs
        # (SessionGetInitializer*) and shared-weight inference must work end to
        # end. Build tools/verify_shared_weights/verify.cpp against the packaged
        # archive and run it on a DeepDoc weight. Fails the release if the
        # vendored patch did not make it into the built library.
        if: matrix.target == 'linux-x86_64'
        shell: bash
        env:
          HF_ENDPOINT: https://huggingface.co
        run: |
          set -euo pipefail
          pkg="${{ env.ORT_PKG }}"
          zip_path="$(ls "$pkg"/dist/*.zip | head -1)"
          [ -n "$zip_path" ] || { echo "::error::no packaged zip found in $pkg/dist"; exit 1; }
          work="$(mktemp -d)"
          unzip -q "$zip_path" -d "$work"
          root="$(find "$work" -maxdepth 1 -type d -name 'onnxruntime-*' | head -1)"
          [ -f "$root/lib/libonnxruntime.a" ] || { echo "::error::libonnxruntime.a missing"; exit 1; }

          mkdir -p "$work/models"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --max-time 600 \
            -o "$work/models/rec.ort" \
            "$HF_ENDPOINT/InfiniFlow/deepdoc/resolve/main/rec.ort" \
            || { echo "::error::failed to download rec.ort"; exit 1; }

          cxx="${CXX:-c++}"
          "$cxx" -O0 -std=c++17 -o "$work/verify" \
            "${{ github.workspace }}/tools/verify_shared_weights/verify.cpp" \
            -I"$root/include" "$root/lib/libonnxruntime.a" -lpthread -ldl -lm

          "$work/verify" "$work/models/rec.ort" 4

      # Portability gate: the Linux x86_64 archive must NOT contain symbols that
      # only exist on toolchains newer than ubuntu-22.04 (glibc 2.35 / GCC 11.4).
      #   - __isoc23_*       : ISO C23 stdio, present only in glibc >= 2.38
      #   - _M_replace_cold  : emitted by libstdc++ from GCC >= 12
      # Either makes the published .a unlinkable on the consumer's Ubuntu 22.04.
      # The Linux job runs on ubuntu-22.04 precisely to avoid them; this fails
      # the release loudly if a future runner image silently bumps the toolchain.
      - name: Portability gate (nm) — linux-x86_64
        if: matrix.target == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          pkg="${{ env.ORT_PKG }}"
          zip_path="$(ls "$pkg"/dist/*.zip | head -1)"
          [ -n "$zip_path" ] || { echo "::error::no packaged zip found in $pkg/dist"; exit 1; }
          work="$(mktemp -d)"
          unzip -q "$zip_path" -d "$work"
          a_path="$(find "$work" -type f -name libonnxruntime.a -print -quit)"
          [ -n "$a_path" ] || { echo "::error::libonnxruntime.a missing in $zip_path"; exit 1; }
          echo "Scanning $a_path for non-portable symbols..."
          if nm "$a_path" 2>/dev/null | grep -E '__isoc23_|_M_replace_cold'; then
            echo "::error::non-portable symbols in $a_path"
            echo "::error::  __isoc23_* needs glibc>=2.38; _M_replace_cold needs libstdc++ from GCC>=12"
            echo "::error::  the Linux job must build on ubuntu-22.04 (glibc 2.35 / GCC 11.4)"
            exit 1
          fi
          echo "OK: no __isoc23_* / _M_replace_cold (glibc 2.35 / GCC 11.4 portable)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-${{ matrix.target }}
          path: |
            ${{ env.ORT_PKG }}/dist/*.zip
            ${{ env.ORT_PKG }}/dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: release
    needs: [prepare, build]
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist

      - name: Build release notes
        # Generated from the artifacts that actually exist, so the download
        # table can never drift out of sync with the build matrix.
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"

          platform_of() {
            case "$1" in
              linux-x86_64)  echo "Linux / x86_64" ;;
              linux-aarch64) echo "Linux / aarch64" ;;
              osx-arm64)     echo "macOS / arm64" ;;
              osx-x86_64)    echo "macOS / x86_64" ;;
              osx-universal) echo "macOS / arm64 + x86_64" ;;
              windows-x64)   echo "Windows / x64" ;;
              windows-arm64) echo "Windows / arm64" ;;
              *)             echo "$1" ;;
            esac
          }

          {
            echo "Customized **static** onnxruntime ${version} build."
            echo
            echo "Configuration: \`Release\`, static library (\`onnxruntime_BUILD_SHARED_LIB=OFF\`),"
            echo "\`--minimal_build --disable_ml_ops --disable_rtti --disable_exceptions\`,"
            echo "reduced to the operators in \`required_operators.config\`"
            echo "(\`--include_ops_by_config\`). Contrib ops stay enabled: the DeepDoc weights"
            echo "need the \`com.microsoft\` fused kernels."
            echo "Upstream ships shared libraries only, hence this repo."
            echo
            echo "## Downloads"
            echo
            echo "| Artifact | Platform | Size | SHA-256 |"
            echo "| --- | --- | --- | --- |"
          } > notes.md

          found=0
          for archive in dist/*.zip; do
            [ -e "$archive" ] || continue
            found=$((found + 1))
            name="$(basename "$archive")"
            target="${name#onnxruntime-${version}-}"
            target="${target%.zip}"
            size="$(du -h "$archive" | cut -f1)"
            sha="n/a"
            [ -f "${archive}.sha256" ] && sha="$(cut -d' ' -f1 "${archive}.sha256")"
            echo "| \`${name}\` | $(platform_of "$target") | ${size} | \`${sha}\` |" >> notes.md
          done

          if [ "$found" -eq 0 ]; then
            echo "::error::no archives found to publish"
            exit 1
          fi

          # one file with every checksum, for a single verification pass
          cat dist/*.sha256 > dist/checksums.txt

          {
            echo
            echo "## Contents"
            echo
            echo '```'
            echo "onnxruntime-${version}-<target>/"
            echo "  include/              public C/C++ headers (flattened, same as upstream packages)"
            echo "  lib/libonnxruntime.a  single fat static library (.lib on Windows)"
            echo "  BUILD_INFO.txt        version, target, source commit, configuration"
            echo "  LICENSE"
            echo '```'
            echo
            echo "## Usage"
            echo
            echo '```bash'
            echo "unzip onnxruntime-${version}-linux-x86_64.zip"
            echo "g++ app.cc -I onnxruntime-${version}-linux-x86_64/include \\"
            echo "    onnxruntime-${version}-linux-x86_64/lib/libonnxruntime.a \\"
            echo "    -lpthread -ldl -lm -o app"
            echo '```'
            echo
            echo "Use \`g++\` (or add \`-lstdc++\`): this is a C++ library even when your own code is C."
            echo
            echo "Verify a download with \`sha256sum -c checksums.txt\`."
          } >> notes.md

          cat notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('onnxruntime-{0}', needs.prepare.outputs.version) || github.ref_name }}
          name: onnxruntime ${{ needs.prepare.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: false
          body_path: notes.md
          files: |
            dist/*.zip
            dist/*.sha256
            dist/checksums.txt
