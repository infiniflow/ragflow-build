name: libvisio release

on:
  pull_request:
    paths:
      - 'libvisio/**'
      - '.github/workflows/libvisio-release.yml'
  push:
    tags:
      - 'libvisio-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'libvisio version to build (default: libvisio/LIBVISIO_VERSION)'
        required: false
        default: ''
      targets:
        description: 'Comma-separated targets to build (default: all). A partial list APPENDS its archives to the existing release instead of replacing it, e.g. "windows-amd64".'
        required: false
        default: ''
      dry_run:
        description: 'Build only, do not publish a GitHub release'
        type: boolean
        default: false
      draft:
        description: 'Publish the release as a draft'
        type: boolean
        default: true

permissions:
  contents: read

env:
  PKG_DIR: libvisio
  # llvm-mingw is the only aarch64-w64-mingw32 toolchain that runs on an x64
  # host; pinned so the arm64 leg does not drift with upstream releases.
  LLVM_MINGW_VERSION: '20261117'
  # target -> runner, the single source of truth for the build matrix. The
  # `targets` input of a manual run narrows it (comma separated), so a single
  # platform can be rebuilt and appended to the already published release
  # without touching the archives that are already there.
  #   linux-amd64  : ubuntu-22.04 pins glibc 2.35 / GCC 11.4 for the consumers.
  #   windows-amd64: MSYS2 MINGW64 (msvcrt) autotools build, ships MinGW .a.
  #   windows-arm64: the same autotools sources cross-compiled from the same x64
  #                  runner with llvm-mingw (UCRT), aarch64 zlib/boost from
  #                  MSYS2's CLANGARM64 prefix. The smoke probe links but does not
  #                  run: an x64 runner cannot execute an arm64 binary.
  TARGET_MATRIX: |
    [
      {"target": "linux-amd64", "os": "ubuntu-22.04"},
      {"target": "linux-arm64", "os": "ubuntu-24.04-arm"},
      {"target": "darwin-arm64", "os": "macos-latest"},
      {"target": "darwin-amd64", "os": "macos-15-intel"},
      {"target": "windows-amd64", "os": "windows-latest"},
      {"target": "windows-arm64", "os": "windows-latest"}
    ]

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
      matrix: ${{ steps.version.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Resolve libvisio version
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_TARGETS: ${{ github.event.inputs.targets }}
        run: |
          set -euo pipefail
          version=""
          tag=""
          case "$REF_NAME" in
            libvisio-v*) tag="$REF_NAME"; version="${REF_NAME#libvisio-}" ;;
          esac
          [ -n "$version" ] || version="$INPUT_VERSION"
          [ -n "$version" ] || version="$(tr -d '[:space:]' < "${{ env.PKG_DIR }}/LIBVISIO_VERSION")"
          case "$version" in
            v*) : ;;
            *) echo "::error::version '$version' must start with 'v' (e.g. v0.1.10)"; exit 1 ;;
          esac
          # A manual run has no tag ref, so the release tag is derived from the
          # version. That is also what makes a partial rebuild land on the
          # release that is already published instead of creating a new one.
          [ -n "$tag" ] || tag="libvisio-${version}"

          # A job-level if cannot see the matrix, so the restriction happens
          # here and the build job consumes the already filtered matrix.
          matrix="$(printf '%s' "$TARGET_MATRIX" | jq -c --arg targets "$INPUT_TARGETS" '
            ($targets | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))) as $want
            | (if ($want | length) == 0 then . else map(select(.target as $t | $want | index($t))) end)
            | {include: .}')"
          if [ -n "$INPUT_TARGETS" ]; then
            # wc -l counts newlines and `printf '%s'` writes no trailing one, so
            # counting this way always reported 0 targets and rejected every
            # filtered build. Ask jq which names are unknown instead.
            unknown="$(printf '%s' "$TARGET_MATRIX" | jq -r --arg targets "$INPUT_TARGETS" '
              ($targets | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))) as $want
              | [.[].target] as $known
              | $want | map(select(. as $w | $known | index($w) | not)) | join(", ")')"
            if [ -n "$unknown" ]; then
              echo "::error::unknown target(s): $unknown; known targets: $(printf '%s' "$TARGET_MATRIX" | jq -r '.[].target' | tr '\n' ' ')"
              exit 1
            fi
          fi

          {
            echo "value=$version"
            echo "tag=$tag"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"
          echo "libvisio version: $version (trigger: ${{ github.event_name }}, ref: $REF_NAME, release tag: $tag)"
          echo "build matrix: $matrix"

  build:
    name: build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libboost-dev pkg-config zlib1g-dev

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install boost pkg-config

      # Unpacks MSYS2 only. The packages are installed by the next step, in the
      # very shell that runs the build: the action's own `install:` input left a
      # cached base installation without a compiler behind, and the failure only
      # surfaced much later as "missing gcc".
      - name: Setup MSYS2 (windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          # No `location`: passing C:\msys64 explicitly makes the action unpack a
          # second level (C:\msys64\msys64). Nothing below needs the absolute
          # path -- the steps run in this root's own shell.
          msystem: MINGW64
          update: false
          cache: false

      - name: Install build deps (windows-amd64, MSYS2)
        # windows-arm64 installs its own cross set below; the x64 toolchain and
        # the x64 boost/zlib would be dead weight on that leg.
        if: matrix.target == 'windows-amd64'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          pacman -Sy --noconfirm
          # m4 is what the windres shim runs over the .rc files
          # (lt-compile-resource); it is not part of the toolchain packages.
          pacman -S --needed --noconfirm \
            mingw-w64-x86_64-toolchain \
            mingw-w64-x86_64-boost \
            mingw-w64-x86_64-zlib \
            make pkgconf m4 zip unzip
          # Assert on the installed file, not on PATH: this shell resolves gcc
          # from the same prefix the build step will use, so a base without the
          # package must fail here instead of minutes later.
          test -x /mingw64/bin/gcc.exe || {
            echo "::error::mingw-w64-x86_64-gcc is not installed under /mingw64"
            pacman -Q | head -20
            exit 1
          }
          gcc --version | head -1
          gcc -dumpmachine

      - name: Build ${{ matrix.target }} (windows, MSYS2)
        if: matrix.target == 'windows-amd64'
        # autotools needs the whole MSYS2 userland (make, pkg-config, sh, ar), and
        # this is the same shell the packages were installed into: no manual
        # `C:\msys64\usr\bin\bash -lc` indirection, no PATH guessing.
        shell: msys2 {0}
        run: |
          set -euo pipefail
          command -v gcc || {
            echo "::error::gcc missing from the MSYS2 MINGW64 shell"
            echo "PATH=$PATH"
            pacman -Q mingw-w64-x86_64-gcc || true
            exit 1
          }
          bash "${{ env.PKG_DIR }}/build.sh" \
            --target 'windows-amd64' \
            --version '${{ needs.prepare.outputs.version }}'

      # Cross toolchain for windows-arm64. llvm-mingw bundles the aarch64 UCRT
      # sysroot and runs on an x64 host; the path is exported because the MSYS2
      # shells below do not reliably inherit the job PATH.
      - name: Setup llvm-mingw (windows-arm64)
        if: matrix.target == 'windows-arm64'
        shell: bash
        env:
          LLVM_MINGW_VERSION: ${{ env.LLVM_MINGW_VERSION }}
        run: |
          set -euo pipefail
          zip_name="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-x86_64.zip"
          work="$RUNNER_TEMP/llvm-mingw"
          mkdir -p "$work"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            -o "$work/$zip_name" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${zip_name}"
          unzip -q "$work/$zip_name" -d "$work"
          bin="$(find "$work" -maxdepth 2 -type d -name bin -print -quit)"
          [ -n "$bin" ] || { echo "::error::llvm-mingw unpacked without bin/"; exit 1; }
          test -x "$bin/aarch64-w64-mingw32-clang.exe" || {
            echo "::error::llvm-mingw ships no aarch64-w64-mingw32-clang"
            ls "$bin" | head -20
            exit 1
          }
          "$bin/aarch64-w64-mingw32-clang.exe" --version | head -1
          printf 'LLVM_MINGW_BIN=%s\n' "$(cygpath -w "$bin")" >> "$GITHUB_ENV"
          printf '%s\n' "$(cygpath -w "$bin")" >> "$GITHUB_PATH"

      # zlib and boost are the only target libraries the autotools build links
      # against. CLANGARM64 packages are aarch64 data (headers + .a), never
      # executed here, so they can be installed next to the MINGW64 toolchain.
      - name: Install arm64 target libs (windows-arm64, MSYS2)
        if: matrix.target == 'windows-arm64'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          pacman -Sy --noconfirm
          pacman -S --needed --noconfirm \
            mingw-w64-clang-aarch64-zlib \
            mingw-w64-clang-aarch64-boost \
            make pkgconf m4 zip unzip
          test -f /clangarm64/lib/libz.a || {
            echo "::error::no aarch64 zlib under /clangarm64"
            exit 1
          }
          test -d /clangarm64/include/boost || {
            echo "::error::no aarch64 boost headers under /clangarm64"
            exit 1
          }
          printf 'ARM64_PREFIX=%s\n' /clangarm64 >> "$GITHUB_ENV"

      - name: Build ${{ matrix.target }} (windows-arm64, MSYS2)
        if: matrix.target == 'windows-arm64'
        # Same autotools build as the amd64 leg, cross-compiled: build.sh's
        # setup_windows_arm64() exports the llvm-mingw tools, --host and the
        # CLANGARM64 include/lib paths, so only the toolchain PATH is set here.
        shell: msys2 {0}
        run: |
          set -euo pipefail
          : "${LLVM_MINGW_BIN:?the llvm-mingw step exported no LLVM_MINGW_BIN}"
          export PATH="$(cygpath -u "$LLVM_MINGW_BIN"):$PATH"
          command -v aarch64-w64-mingw32-clang || {
            echo "::error::aarch64-w64-mingw32-clang is not on PATH"
            echo "PATH=$PATH"
            exit 1
          }
          bash "${{ env.PKG_DIR }}/build.sh" \
            --target 'windows-arm64' \
            --version '${{ needs.prepare.outputs.version }}'

      - name: Build ${{ matrix.target }} (posix)
        if: ${{ !startsWith(matrix.target, 'windows') }}
        shell: bash
        run: |
          set -euo pipefail
          bash "${{ env.PKG_DIR }}/build.sh" \
            --target "${{ matrix.target }}" \
            --version "${{ needs.prepare.outputs.version }}"

      - name: Write the smoke probe script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/smoke.sh" << 'SMOKE'
          set -euo pipefail
          # One glob per platform: `ls a/*.tar.gz b/*.zip` fails with status 2
          # whenever the second pattern matches nothing, and -o pipefail turns
          # that into a silent exit.
          archive=""
          for candidate in "${{ env.PKG_DIR }}"/dist/*.tar.gz "${{ env.PKG_DIR }}"/dist/*.zip; do
            [ -e "$candidate" ] || continue
            archive="$candidate"
            break
          done
          [ -n "$archive" ] || { echo "::error::no archive found"; exit 1; }
          work="$(mktemp -d)"
          case "$archive" in
            *.zip)  unzip -q "$archive" -d "$work" ;;
            *)      tar -xzf "$archive" -C "$work" ;;
          esac

          # Tool selection first: the archiver/inspector must understand the
          # archive. MSYS2's x64 binutils cannot read an aarch64 one, so the arm64
          # leg uses llvm-mingw's triple-prefixed tools. libxml2 is configured
          # --without-zlib, but librevenge-stream's RVNGZipStream inflates the zip
          # parts embedded in a vsdx/vsdm, so zlib is required on every platform.
          bin_prefix=""
          cxx="c++"
          libs="-lz"
          probe="$work/probe"
          run_probe=1
          case "$(uname -s)" in
            MINGW*|MSYS*|CYGWIN*)
              probe="$work/probe.exe"
              if [ "${{ matrix.target }}" = "windows-arm64" ]; then
                # An x64 runner cannot execute an arm64 binary, so this leg only
                # links. -L points at the aarch64 zlib the build compiled against.
                bin_prefix="aarch64-w64-mingw32-"
                cxx="${bin_prefix}clang++"
                libs="-lz -static -L${ARM64_PREFIX:-/clangarm64}/lib"
                run_probe=0
              else
                libs="-lz -static-libgcc -static-libstdc++"
              fi
              ;;
          esac

          # Verify no nested archive members in libvisio-0.1.a and no real ICU ucnv_* refs.
          if "${bin_prefix}ar" t "$work/lib/libvisio-0.1.a" | grep -q '\.a$'; then
            echo "::error::unexpected non-object member inside libvisio-0.1.a"
            exit 1
          fi
          if "${bin_prefix}nm" -u "$work/lib/libvisio-0.1.a" | grep -E 'ucnv_' | grep -vq 'visio_ucnv_'; then
            echo "::error::unexpected unshimmed ICU ucnv_* reference in libvisio-0.1.a"
            exit 1
          fi

          cat > "$work/probe.cc" << 'EOF'
          #include <cstdint>
          #include <librevenge-generators/librevenge-generators.h>
          #include <librevenge-stream/librevenge-stream.h>
          #include <libvisio/libvisio.h>
          extern "C" {
          struct VisioUConverter;
          VisioUConverter *visio_ucnv_open(const char *, int32_t *err) { if (err) *err = 1; return nullptr; }
          int32_t visio_ucnv_getNextUChar(VisioUConverter *, const char **, const char *, int32_t *err) { if (err) *err = 1; return -1; }
          void visio_ucnv_close(VisioUConverter *) {}
          }
          int main() {
              const unsigned char dummy[] = {'n','o','t','v','i','s','i','o'};
              librevenge::RVNGStringStream input(dummy, sizeof(dummy));
              librevenge::RVNGStringVector svgs;
              librevenge::RVNGSVGDrawingGenerator gen(svgs, "");
              return libvisio::VisioDocument::parse(&input, &gen) ? 1 : 0;
          }
          EOF

          "$cxx" -std=c++17 -o "$probe" "$work/probe.cc" \
            -I"$work/include/libvisio-0.1" -I"$work/include/librevenge-0.0" \
            "$work/lib/libvisio-0.1.a" \
            "$work/lib/librevenge-generators-0.0.a" \
            "$work/lib/librevenge-stream-0.0.a" \
            "$work/lib/librevenge-0.0.a" \
            "$work/lib/libxml2.a" \
            $libs
          if [ "$run_probe" -eq 1 ]; then
            "$probe"
            echo "OK: probe linked and ran cleanly on ${{ matrix.target }}"
          else
            echo "OK: windows-arm64 probe linked against the packaged archives (not executed)"
          fi
          SMOKE

      - name: Smoke test (windows, MSYS2)
        if: startsWith(matrix.target, 'windows')
        shell: msys2 {0}
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = "windows-arm64" ]; then
            : "${LLVM_MINGW_BIN:?the llvm-mingw step exported no LLVM_MINGW_BIN}"
            export PATH="$(cygpath -u "$LLVM_MINGW_BIN"):$PATH"
          fi
          bash "$(cygpath -u "$RUNNER_TEMP")/smoke.sh"

      - name: Smoke test (posix)
        if: ${{ !startsWith(matrix.target, 'windows') }}
        shell: bash
        run: bash "$RUNNER_TEMP/smoke.sh"

      - name: Portability gate (nm) — linux-amd64
        if: matrix.target == 'linux-amd64'
        shell: bash
        run: |
          set -euo pipefail
          archive="$(ls "${{ env.PKG_DIR }}"/dist/*.tar.gz | head -1)"
          work="$(mktemp -d)"
          tar -xzf "$archive" -C "$work"
          for a in "$work"/lib/*.a; do
            if nm "$a" 2>/dev/null | grep -E '__isoc23_|_M_replace_cold'; then
              echo "::error::non-portable symbols in $a (must build on ubuntu-22.04)"
              exit 1
            fi
          done
          echo "OK: no __isoc23_* / _M_replace_cold symbols"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libvisio-${{ matrix.target }}
          path: |
            ${{ env.PKG_DIR }}/dist/*.tar.gz
            ${{ env.PKG_DIR }}/dist/*.zip
            ${{ env.PKG_DIR }}/dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: release
    needs: [prepare, build]
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # A partial build (targets input) must not replace a published release:
      # keep the archives that are already there and only add the ones built
      # now. The existing checksums.txt is the source of truth for what is
      # already published, so it is fetched and merged rather than rewritten.
      - name: Fetch the published release state
        id: existing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.targets != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p existing
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern 'checksums.txt' --dir existing || true
            echo "append=true" >> "$GITHUB_OUTPUT"
            echo "appending to the existing release $TAG"
          else
            echo "append=false" >> "$GITHUB_OUTPUT"
            echo "no release for $TAG yet; publishing a new one"
          fi

      - name: Build release notes
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"

          {
            echo "Static **libvisio ${version}** (+ librevenge 0.0.5 + libxml2 2.12.9) built from unmodified upstream sources."
            echo
            echo "ICU converter calls (\`ucnv_open\` / \`ucnv_getNextUChar\` / \`ucnv_close\`) are remapped at compile time to \`visio_ucnv_*\` to avoid ICU symbol collisions with \`libpdfium.a\`."
            echo
            echo "## Downloads"
            echo
            echo "| Artifact | Target | Size | SHA-256 |"
            echo "| --- | --- | --- | --- |"
          } > notes.md

          found=0
          for archive in dist/*.tar.gz dist/*.zip; do
            [ -e "$archive" ] || continue
            found=$((found + 1))
            name="$(basename "$archive")"
            target="${name#libvisio-${version}-}"
            target="${target%.tar.gz}"
            target="${target%.zip}"
            size="$(du -h "$archive" | cut -f1)"
            sha="n/a"
            [ -f "${archive}.sha256" ] && sha="$(cut -d' ' -f1 "${archive}.sha256")"
            echo "| \`${name}\` | \`${target}\` | ${size} | \`${sha}\` |" >> notes.md
          done

          [ "$found" -gt 0 ] || { echo "::error::no archives found"; exit 1; }

          cat dist/*.sha256 > dist/checksums.txt
          if [ -f existing/checksums.txt ]; then
            # Union of what is already published and what this run built; a name
            # in both keeps this run's line so a re-run corrects a stale digest
            # instead of duplicating the entry.
            awk 'FNR==NR { if (NF) seen[$NF]=1; print; next }
                 { if (NF && !($NF in seen)) print }' \
              dist/checksums.txt existing/checksums.txt > dist/checksums.merged
            mv dist/checksums.merged dist/checksums.txt
          fi
          cat notes.md dist/checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: libvisio ${{ needs.prepare.outputs.version }}
          # Never demote an already published release back to a draft when a
          # partial build appends to it.
          draft: ${{ steps.existing.outputs.append != 'true' && github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          append_body: ${{ steps.existing.outputs.append == 'true' }}
          prerelease: false
          body_path: notes.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/checksums.txt
