name: svgrender release

on:
  pull_request:
    paths:
      - 'svgrender/**'
      - '.github/workflows/svgrender-release.yml'
  push:
    tags:
      - 'svgrender-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'svgrender version to build (default: svgrender/SVGRENDER_VERSION)'
        required: false
        default: ''
      dry_run:
        description: 'Build only, do not publish a GitHub release'
        type: boolean
        default: false
      draft:
        description: 'Publish the release as a draft'
        type: boolean
        default: true

permissions:
  contents: read

env:
  PKG_DIR: svgrender

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Resolve svgrender version
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          version=""
          case "$REF_NAME" in
            svgrender-v*) version="${REF_NAME#svgrender-}" ;;
          esac
          [ -n "$version" ] || version="$INPUT_VERSION"
          [ -n "$version" ] || version="$(tr -d '[:space:]' < "${{ env.PKG_DIR }}/SVGRENDER_VERSION")"
          case "$version" in
            v*) : ;;
            *) echo "::error::version '$version' must start with 'v' (e.g. v0.45.1)"; exit 1 ;;
          esac
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "svgrender version: $version (trigger: ${{ github.event_name }}, ref: $REF_NAME)"

  build:
    name: build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            # ubuntu-22.04 pins glibc 2.35 so the staticlib links on Ubuntu 22.04+ consumers.
            os: ubuntu-22.04
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: darwin-arm64
            os: macos-latest
          - target: darwin-amd64
            os: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build ${{ matrix.target }}
        shell: bash
        run: |
          bash "${{ env.PKG_DIR }}/build.sh" \
            --target "${{ matrix.target }}" \
            --version "${{ needs.prepare.outputs.version }}"

      - name: Smoke test (link and render SVG to PNG)
        shell: bash
        run: |
          set -euo pipefail
          archive="$(ls "${{ env.PKG_DIR }}"/dist/*.tar.gz | head -1)"
          [ -n "$archive" ] || { echo "::error::no archive found"; exit 1; }
          work="$(mktemp -d)"
          tar -xzf "$archive" -C "$work"

          cat > "$work/probe.c" << 'EOF'
          #include <stdio.h>
          #include <string.h>
          #include "svgrender.h"
          int main(void) {
              const char *svg = "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"100\" height=\"50\"><rect width=\"100\" height=\"50\" fill=\"#ff0000\"/></svg>";
              uint8_t *png = NULL;
              size_t len = 0;
              char *err = NULL;
              int32_t rc = svgrender_render_png((const uint8_t *)svg, strlen(svg), 200, 1000000, &png, &len, &err);
              if (rc != 0 || !png || len < 8) {
                  fprintf(stderr, "render failed rc=%d err=%s\n", rc, err ? err : "(null)");
                  if (err) svgrender_free_string(err);
                  return 1;
              }
              const uint8_t magic[8] = {0x89, 'P', 'N', 'G', 0x0d, 0x0a, 0x1a, 0x0a};
              int ok = memcmp(png, magic, 8) == 0;
              svgrender_free_bytes(png, len);
              if (!ok) {
                  fprintf(stderr, "invalid png magic\n");
                  return 1;
              }
              printf("ok png_bytes=%zu\n", len);
              return 0;
          }
          EOF

          if [ "$(uname -s)" = "Darwin" ]; then
            cc -o "$work/probe" "$work/probe.c" -I"$work/include" "$work/lib/libsvgrender.a" -lm -lpthread -ldl
          else
            cc -o "$work/probe" "$work/probe.c" -I"$work/include" "$work/lib/libsvgrender.a" -lm -lpthread -ldl
          fi
          "$work/probe"

      - name: Portability gate (nm) — linux-amd64
        if: matrix.target == 'linux-amd64'
        shell: bash
        run: |
          set -euo pipefail
          archive="$(ls "${{ env.PKG_DIR }}"/dist/*.tar.gz | head -1)"
          work="$(mktemp -d)"
          tar -xzf "$archive" -C "$work"
          if nm "$work/lib/libsvgrender.a" 2>/dev/null | grep -E '__isoc23_|_M_replace_cold'; then
            echo "::error::non-portable symbols in libsvgrender.a (must build on ubuntu-22.04)"
            exit 1
          fi
          echo "OK: no __isoc23_* / _M_replace_cold symbols"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: svgrender-${{ matrix.target }}
          path: |
            ${{ env.PKG_DIR }}/dist/*.tar.gz
            ${{ env.PKG_DIR }}/dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: release
    needs: [prepare, build]
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build release notes
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"

          {
            echo "Static **svgrender ${version}** C-API library wrapping unmodified upstream \`resvg\` (Apache-2.0 OR MIT)."
            echo
            echo "## Downloads"
            echo
            echo "| Artifact | Target | Size | SHA-256 |"
            echo "| --- | --- | --- | --- |"
          } > notes.md

          found=0
          for archive in dist/*.tar.gz; do
            [ -e "$archive" ] || continue
            found=$((found + 1))
            name="$(basename "$archive")"
            target="${name#svgrender-${version}-}"
            target="${target%.tar.gz}"
            size="$(du -h "$archive" | cut -f1)"
            sha="n/a"
            [ -f "${archive}.sha256" ] && sha="$(cut -d' ' -f1 "${archive}.sha256")"
            echo "| \`${name}\` | \`${target}\` | ${size} | \`${sha}\` |" >> notes.md
          done

          [ "$found" -gt 0 ] || { echo "::error::no archives found"; exit 1; }
          cat dist/*.sha256 > dist/checksums.txt
          cat notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('svgrender-{0}', needs.prepare.outputs.version) || github.ref_name }}
          name: svgrender ${{ needs.prepare.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: false
          body_path: notes.md
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/checksums.txt
