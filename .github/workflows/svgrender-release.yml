name: svgrender release

on:
  pull_request:
    paths:
      - 'svgrender/**'
      - '.github/workflows/svgrender-release.yml'
  push:
    tags:
      - 'svgrender-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'svgrender version to build (default: svgrender/SVGRENDER_VERSION)'
        required: false
        default: ''
      targets:
        description: 'Comma-separated targets to build (default: all). A partial list APPENDS its archives to the existing release instead of replacing it, e.g. "windows-amd64".'
        required: false
        default: ''
      dry_run:
        description: 'Build only, do not publish a GitHub release'
        type: boolean
        default: false
      draft:
        description: 'Publish the release as a draft'
        type: boolean
        default: true

permissions:
  contents: read

env:
  PKG_DIR: svgrender
  # target -> runner, the single source of truth for the build matrix. The
  # `targets` input of a manual run narrows it (comma separated), so a single
  # platform can be rebuilt and appended to the already published release
  # without touching the archives that are already there.
  #   linux-amd64  : ubuntu-22.04 pins glibc 2.35 for the consumers.
  #   windows-amd64: MinGW-w64 / msvcrt staticlib, built for
  #                  x86_64-pc-windows-gnu (the Go sidecar's cgo toolchain).
  TARGET_MATRIX: |
    [
      {"target": "linux-amd64", "os": "ubuntu-22.04"},
      {"target": "linux-arm64", "os": "ubuntu-24.04-arm"},
      {"target": "darwin-arm64", "os": "macos-latest"},
      {"target": "darwin-amd64", "os": "macos-15-intel"},
      {"target": "windows-amd64", "os": "windows-latest"}
    ]

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
      matrix: ${{ steps.version.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Resolve svgrender version
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_TARGETS: ${{ github.event.inputs.targets }}
        run: |
          set -euo pipefail
          version=""
          tag=""
          case "$REF_NAME" in
            svgrender-v*) tag="$REF_NAME"; version="${REF_NAME#svgrender-}" ;;
          esac
          [ -n "$version" ] || version="$INPUT_VERSION"
          [ -n "$version" ] || version="$(tr -d '[:space:]' < "${{ env.PKG_DIR }}/SVGRENDER_VERSION")"
          case "$version" in
            v*) : ;;
            *) echo "::error::version '$version' must start with 'v' (e.g. v0.45.1)"; exit 1 ;;
          esac
          # A manual run has no tag ref, so the release tag is derived from the
          # version. That is also what makes a partial rebuild land on the
          # release that is already published instead of creating a new one.
          [ -n "$tag" ] || tag="svgrender-${version}"

          # A job-level if cannot see the matrix, so the restriction happens
          # here and the build job consumes the already filtered matrix.
          matrix="$(printf '%s' "$TARGET_MATRIX" | jq -c --arg targets "$INPUT_TARGETS" '
            ($targets | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))) as $want
            | (if ($want | length) == 0 then . else map(select(.target as $t | $want | index($t))) end)
            | {include: .}')"
          if [ -n "$INPUT_TARGETS" ]; then
            want_n="$(printf '%s' "$INPUT_TARGETS" | tr ',' '\n' | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')"
            got_n="$(printf '%s' "$matrix" | jq '.include | length')"
            if [ "$want_n" != "$got_n" ]; then
              echo "::error::unknown target in '$INPUT_TARGETS'; known targets: $(printf '%s' "$TARGET_MATRIX" | jq -r '.[].target' | tr '\n' ' ')"
              exit 1
            fi
          fi

          {
            echo "value=$version"
            echo "tag=$tag"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"
          echo "svgrender version: $version (trigger: ${{ github.event_name }}, ref: $REF_NAME, release tag: $tag)"
          echo "build matrix: $matrix"

  build:
    name: build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup MinGW-w64 (windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          # fixed location: the build step prepends /c/msys64/mingw64/bin to PATH
          location: C:\msys64
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            zip

      - name: Setup Rust toolchain
        if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust toolchain (windows-gnu target)
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Build ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            # rustc links a windows-gnu staticlib with the MinGW-w64 gcc that
            # msys2/setup-msys2 installed; Git Bash supplies the rest.
            export PATH="/c/msys64/mingw64/bin:$PATH"
          fi
          bash "${{ env.PKG_DIR }}/build.sh" \
            --target "${{ matrix.target }}" \
            --version "${{ needs.prepare.outputs.version }}"

      - name: Smoke test (link and render SVG to PNG)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            export PATH="/c/msys64/mingw64/bin:$PATH"
          fi
          archive="$(ls "${{ env.PKG_DIR }}"/dist/*.tar.gz "${{ env.PKG_DIR }}"/dist/*.zip 2>/dev/null | head -1)"
          [ -n "$archive" ] || { echo "::error::no archive found"; exit 1; }
          work="$(mktemp -d)"
          case "$archive" in
            *.zip)
              if command -v unzip >/dev/null 2>&1; then
                unzip -q "$archive" -d "$work"
              else
                # Git Bash has no unzip; PowerShell's Expand-Archive does the job.
                powershell -NoProfile -NonInteractive -Command \
                  "Expand-Archive -LiteralPath '$(cygpath -w "$archive")' -DestinationPath '$(cygpath -w "$work")' -Force"
              fi
              ;;
            *)
              tar -xzf "$archive" -C "$work"
              ;;
          esac

          cat > "$work/probe.c" << 'EOF'
          #include <stdio.h>
          #include <string.h>
          #include "svgrender.h"
          int main(void) {
              const char *svg = "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"100\" height=\"50\"><rect width=\"100\" height=\"50\" fill=\"#ff0000\"/></svg>";
              uint8_t *png = NULL;
              size_t len = 0;
              char *err = NULL;
              int32_t rc = svgrender_render_png((const uint8_t *)svg, strlen(svg), 200, 1000000, &png, &len, &err);
              if (rc != 0 || !png || len < 8) {
                  fprintf(stderr, "render failed rc=%d err=%s\n", rc, err ? err : "(null)");
                  if (err) svgrender_free_string(err);
                  return 1;
              }
              const uint8_t magic[8] = {0x89, 'P', 'N', 'G', 0x0d, 0x0a, 0x1a, 0x0a};
              int ok = memcmp(png, magic, 8) == 0;
              svgrender_free_bytes(png, len);
              if (!ok) {
                  fprintf(stderr, "invalid png magic\n");
                  return 1;
              }
              printf("ok png_bytes=%zu\n", len);
              return 0;
          }
          EOF

          probe="$work/probe"
          libs="-lm -lpthread -ldl"
          if [ "${{ runner.os }}" = "Windows" ]; then
            # A Rust std staticlib for windows-gnu references Win32 and
            # CNG/registry entry points; the final link has to name them.
            # -ldl is a Linux-only library, so the unix list is replaced.
            probe="$work/probe.exe"
            libs="-lm -lws2_32 -luserenv -lbcrypt -lntdll -lole32 -lshell32 -ladvapi32"
          fi
          cc -o "$probe" "$work/probe.c" -I"$work/include" "$work/lib/libsvgrender.a" $libs
          "$probe"

      - name: Portability gate (nm) — linux-amd64
        if: matrix.target == 'linux-amd64'
        shell: bash
        run: |
          set -euo pipefail
          archive="$(ls "${{ env.PKG_DIR }}"/dist/*.tar.gz | head -1)"
          work="$(mktemp -d)"
          tar -xzf "$archive" -C "$work"
          if nm "$work/lib/libsvgrender.a" 2>/dev/null | grep -E '__isoc23_|_M_replace_cold'; then
            echo "::error::non-portable symbols in libsvgrender.a (must build on ubuntu-22.04)"
            exit 1
          fi
          echo "OK: no __isoc23_* / _M_replace_cold symbols"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: svgrender-${{ matrix.target }}
          path: |
            ${{ env.PKG_DIR }}/dist/*.tar.gz
            ${{ env.PKG_DIR }}/dist/*.zip
            ${{ env.PKG_DIR }}/dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: release
    needs: [prepare, build]
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # A partial build (targets input) must not replace a published release:
      # keep the archives that are already there and only add the ones built
      # now. The existing checksums.txt is the source of truth for what is
      # already published, so it is fetched and merged rather than rewritten.
      - name: Fetch the published release state
        id: existing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.targets != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p existing
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern 'checksums.txt' --dir existing || true
            echo "append=true" >> "$GITHUB_OUTPUT"
            echo "appending to the existing release $TAG"
          else
            echo "append=false" >> "$GITHUB_OUTPUT"
            echo "no release for $TAG yet; publishing a new one"
          fi

      - name: Build release notes
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"

          {
            echo "Static **svgrender ${version}** C-API library wrapping unmodified upstream \`resvg\` (Apache-2.0 OR MIT)."
            echo
            echo "## Downloads"
            echo
            echo "| Artifact | Target | Size | SHA-256 |"
            echo "| --- | --- | --- | --- |"
          } > notes.md

          found=0
          for archive in dist/*.tar.gz dist/*.zip; do
            [ -e "$archive" ] || continue
            found=$((found + 1))
            name="$(basename "$archive")"
            target="${name#svgrender-${version}-}"
            target="${target%.tar.gz}"
            target="${target%.zip}"
            size="$(du -h "$archive" | cut -f1)"
            sha="n/a"
            [ -f "${archive}.sha256" ] && sha="$(cut -d' ' -f1 "${archive}.sha256")"
            echo "| \`${name}\` | \`${target}\` | ${size} | \`${sha}\` |" >> notes.md
          done

          [ "$found" -gt 0 ] || { echo "::error::no archives found"; exit 1; }

          cat dist/*.sha256 > dist/checksums.txt
          if [ -f existing/checksums.txt ]; then
            # Union of what is already published and what this run built; a name
            # in both keeps this run's line so a re-run corrects a stale digest
            # instead of duplicating the entry.
            awk 'FNR==NR { if (NF) seen[$NF]=1; print; next }
                 { if (NF && !($NF in seen)) print }' \
              dist/checksums.txt existing/checksums.txt > dist/checksums.merged
            mv dist/checksums.merged dist/checksums.txt
          fi
          cat notes.md dist/checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: svgrender ${{ needs.prepare.outputs.version }}
          # Never demote an already published release back to a draft when a
          # partial build appends to it.
          draft: ${{ steps.existing.outputs.append != 'true' && github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          append_body: ${{ steps.existing.outputs.append == 'true' }}
          prerelease: false
          body_path: notes.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/checksums.txt
